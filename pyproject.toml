[project]
name = "yaraci"
version = "0.1.0"
description = "CI harness for YARA rule quality: lint, true/false-positive tests, per-rule profiling, rule-set diffs, JUnit/SARIF output."
readme = "README.md"
license = "MIT"
authors = [{ name = "yaraci contributors" }]
requires-python = ">=3.12"
dependencies = [
    "yara-x>=1.22.0,<2",
    "yara-python>=4.5.4,<5",
]

[project.scripts]
yaraci = "yaraci.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "PIE", "RET", "N", "S"]
ignore = [
    "PLR2004", # magic values are domain thresholds, documented in place
    "PLR0913", # CLI-facing functions legitimately take many options
    "PLR0917", # internal helpers take explicit positional context
    "S101",    # asserts narrow types for mypy
    "S603",    # subprocess with fixed argv in scripts
    "RET505",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR0915", "PLC0415", "E501"]  # parametrized rule sources read best unwrapped
"scripts/**" = ["S310", "S311", "T201"]  # seeded PRNG generates deterministic, non-secret test data

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["yara", "yara_x"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["yaraci"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
